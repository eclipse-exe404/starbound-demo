<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STARBOUND</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="title" class="screen on">
  <div class="ring"><i></i></div>
  <h1>STARBOUND</h1>
  <p class="tag">Your memories can no longer be trusted. Can you trust the people you love?</p>
  <button class="btn main" id="play">Play game</button>
  <button class="btn" id="cont">Continue</button>
</section>
<section id="name" class="screen">
  <p class="who">Medical officer registration</p>
  <p class="tag" style="margin-bottom:0">What name should the crew call you?</p>
  <input id="nameIn" maxlength="16" autocomplete="off" placeholder="Enter your name" aria-label="Your name">
  <button class="btn main" id="begin" disabled>Begin</button>
  <button class="btn" id="back1">Back</button>
</section>
<section id="game" class="screen">
  <div id="bg"></div>
  <div id="stage"></div>
  <div id="ui">
    <div class="box" id="box"><p class="who" id="who"></p><p id="text"></p><p class="hint" id="hint">Tap to continue</p></div>
    <div id="choices"></div>
  </div>
</section>
<script src="chapter1.js"></script>
<script src="engine.js"></script>
</body>
</html>
